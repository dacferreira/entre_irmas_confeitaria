<form class="dialogo" [formGroup]="formulario" (ngSubmit)="salvar()" novalidate aria-labelledby="categoria-titulo">
  <div class="dialogo__topo">
    <h2 id="categoria-titulo">{{ edicao ? 'Editar categoria' : 'Nova categoria' }}</h2>
    <button type="button" class="botao-icone" aria-label="Fechar" (click)="cancelar()">
      <eirm-icone nome="fechar" />
    </button>
  </div>

  <div class="dialogo__corpo">
    <mat-form-field>
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" maxlength="100" />
      @if (formulario.controls.nome.hasError('required')) {
        <mat-error>Informe o nome.</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="descricao" rows="2" maxlength="300"></textarea>
      <mat-hint>Uma frase curta que aparece no cardápio.</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Ordem no cardápio</mat-label>
      <input matInput type="number" min="0" max="999" formControlName="ordem" />
      <mat-hint>Números menores aparecem primeiro.</mat-hint>
      @if (formulario.controls.ordem.invalid) {
        <mat-error>Entre 0 e 999.</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="dialogo__rodape">
    <button type="button" class="botao botao--contorno botao--pequeno" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="botao botao--pequeno" [disabled]="salvando()">
      {{ salvando() ? 'Salvando…' : edicao ? 'Salvar alterações' : 'Criar categoria' }}
    </button>
  </div>
</form>
